# Daily enrichment: pick next 70 existing customers and pull their
# Facebook / X / Instagram URLs from their website + LinkedIn /about.
# Writes results back to Turso (production DB).
#
# Triggered: every day at 06:00 UTC (~09:00 Israel time).
# Manual trigger: Actions tab → Daily Social Enrichment → Run workflow.

name: Daily Social Enrichment
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "How many customers to enrich (default 70)"
        required: false
        default: "70"

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run enrichment
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BATCH: ${{ github.event.inputs.batch || '70' }}
        run: pnpm tsx scripts/enrich-social.ts
